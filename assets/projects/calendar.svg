<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="AI Google Calendar Assistant workflow illustration">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E1A33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#101517;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2230;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12141D;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feOffset dx="0" dy="4" in="blur" result="offsetBlur" />
      <feComponentTransfer in="offsetBlur">
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="offsetBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Dotted grid -->
  <rect width="800" height="500" fill="none" stroke="rgba(225,6,0,0.03)" stroke-width="1" />
  <path d="M0 50 L800 50 M0 100 L800 100 M0 150 L800 150 M0 200 L800 200 M0 250 L800 250 M0 300 L800 300 M0 350 L800 350 M0 400 L800 400 M0 450 L800 450 M50 0 L50 500 M150 0 L150 500 M250 0 L250 500 M350 0 L350 500 M450 0 L450 500 M550 0 L550 500 M650 0 L650 500 M750 0 L750 500" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Soft glow blob -->
  <circle cx="650" cy="100" r="120" fill="#E10600" opacity="0.15" filter="blur(40px)" />
  <circle cx="150" cy="380" r="100" fill="#4C8DF6" opacity="0.1" filter="blur(40px)" />

  <!-- Calendar card -->
  <g transform="translate(60, 160)">
    <rect width="300" height="300" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#softShadow)" />
    
    <!-- Calendar header -->
    <rect x="20" y="20" width="260" height="40" rx="8" fill="#101517" />
    <text x="40" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F2F4F5">October 2026</text>
    <text x="230" y="40" font-family="system-ui, sans-serif" font-size="13" fill="#8A9499">•••</text>
    
    <!-- Day headers -->
    <g font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#8A9499">
      <text x="45" y="62" text-anchor="middle">M</text>
      <text x="89" y="62" text-anchor="middle">T</text>
      <text x="133" y="62" text-anchor="middle">W</text>
      <text x="177" y="62" text-anchor="middle">T</text>
      <text x="221" y="62" text-anchor="middle">F</text>
    </g>
    
    <!-- Calendar grid -->
    <g font-family="system-ui, sans-serif" font-size="14" fill="#F2F4F5">
      <!-- Row 1 -->
      <text x="45" y="88" text-anchor="middle">1</text>
      <text x="89" y="88" text-anchor="middle">2</text>
      <text x="133" y="88" text-anchor="middle">3</text>
      <text x="177" y="88" text-anchor="middle">4</text>
      <text x="221" y="88" text-anchor="middle">5</text>
      <!-- Row 2 -->
      <text x="45" y="114" text-anchor="middle">6</text>
      <text x="89" y="114" text-anchor="middle">7</text>
      <rect x="74" y="104" width="30" height="30" rx="6" fill="#4C8DF6" />
      <text x="89" y="124" text-anchor="middle" fill="#0E1A33" font-weight="700">8</text>
      <rect x="164" y="104" width="30" height="30" rx="6" fill="#2DD4BF" />
      <text x="179" y="124" text-anchor="middle" fill="#0E1A33" font-weight="700">9</text>
      <text x="221" y="114" text-anchor="middle">9</text>
      <!-- Row 3 -->
      <text x="45" y="150" text-anchor="middle">10</text>
      <text x="89" y="150" text-anchor="middle">11</text>
      <text x="133" y="150" text-anchor="middle">12</text>
      <text x="177" y="150" text-anchor="middle">13</text>
      <text x="221" y="150" text-anchor="middle">14</text>
      <!-- Row 4 -->
      <text x="45" y="166" text-anchor="middle">15</text>
      <rect x="74" y="156" width="30" height="30" rx="6" fill="#E10600" opacity="0.15" stroke="#E10600" stroke-width="1.5" />
      <text x="89" y="174" text-anchor="middle" fill="#E10600" font-weight="700">16</text>
      <text x="133" y="166" text-anchor="middle">17</text>
      <text x="177" y="166" text-anchor="middle">18</text>
      <text x="221" y="166" text-anchor="middle">19</text>
      <!-- Row 5 -->
      <text x="45" y="182" text-anchor="middle">20</text>
      <text x="89" y="182" text-anchor="middle">21</text>
      <text x="133" y="182" text-anchor="middle">22</text>
      <text x="177" y="182" text-anchor="middle">23</text>
      <text x="221" y="182" text-anchor="middle">24</text>
      <!-- Row 6 -->
      <text x="45" y="198" text-anchor="middle">25</text>
      <text x="89" y="198" text-anchor="middle">26</text>
      <text x="133" y="198" text-anchor="middle">27</text>
      <text x="177" y="198" text-anchor="middle">28</text>
      <text x="221" y="198" text-anchor="middle">29</text>
      <text x="221" y="214" text-anchor="middle">30</text>
    </g>
    
    <!-- Glowing event card -->
    <rect x="40" y="240" width="120" height="90" rx="10" fill="#101517" stroke="#E10600" stroke-width="2" filter="url(#glow)" />
    <text x="55" y="260" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F2F4F5">Team Sync</text>
    <text x="55" y="276" font-family="system-ui, sans-serif" font-size="11" fill="#9A9499">14:00 • Online</text>
    <circle x="55" y="286" r="5" fill="#E10600" />
    <text x="65" y="290" font-family="system-ui, sans-serif" font-size="10" fill="#F2F4F5">•</text>
    <text x="75" y="290" font-family="system-ui, sans-serif" font-size="10" fill="#F2F4F5">•</text>
    <text x="85" y="290" font-family="system-ui, sans-serif" font-size="10" fill="#F2F4F5">•</text>
  </div>
  
  <!-- Right side: chat bubble + flow -->
  <g transform="translate(420, 160)">
    <!-- Chat bubble -->
    <rect x="0" y="20" width="180" height="120" rx="16" fill="#161C1F" stroke="#222" stroke-width="1" />
    <text x="30" y="45" font-family="system-ui, sans-serif" font-size="13" fill="#F2F4F5">Book a meeting</text>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="13" fill="#F2F4F5">tomorrow at 3 PM</text>
    <circle x="160" y="40" r="10" fill="#4C8DF6" />
    <text x="155" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#0E1A33" font-weight="700" text-anchor="middle">T</text>
    
    <!-- Connector line -->
    <line x1="330" y="110" x2="380" y="110" stroke="#333" stroke-width="2" />
    <circle cx="330" cy="110" r="4" fill="#4C8DF6" />
    
    <!-- Node flow -->
    <g transform="translate(390, 90)">
      <rect x="0" y="0" width="100" height="50" rx="8" fill="#161C1F" stroke="#333" stroke-width="1" />
      <text x="50" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#F2F4F5">Webhook</text>
      <line x1="100" y="25" x2="120" y="25" stroke="#333" stroke-width="2" />
      <circle cx="128" cy="25" r="4" fill="#4C8DF6" />
      
      <rect x="130" y="0" width="100" height="50" rx="8" fill="#161C1F" stroke="#333" stroke-width="1" />
      <text x="180" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#F2F4F5">OpenAI</text>
      <line x1="230" y="25" x2="250" y="25" stroke="#333" stroke-width="2" />
      <circle cx="258" cy="25" r="4" fill="#4C8DF6" />
      
      <rect x="260" y="0" width="100" height="50" rx="8" fill="#161C1F" stroke="#333" stroke-width="1" />
      <text x="310" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#F2F4F5">Validate</text>
      <line x1="360" y="25" x2="420" y="25" stroke="#333" stroke-width="2" />
      <circle cx="428" cy="25" r="4" fill="#4C8DF6" />
      
      <rect x="430" y="0" width="100" height="50" rx="8" fill="#161C1F" stroke="#333" stroke-width="1" />
      <text x="480" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#F2F4F5">Calendar</text>
    </g>
    
    <!-- Toast -->
    <rect x="420" y="160" width="140" height="60" rx="8" fill="#101517" stroke="#E10600" stroke-width="1" filter="url(#glow)" />
    <text x="440" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#E10600" font-weight="700">✓ Confirmation sent</text>
    <text x="440" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#9A9499">Event added to calendar</text>
  </g>
</svg>