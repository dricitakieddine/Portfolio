<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Calendar workflow illustration">
  <defs>
    <style>
      .node { fill: #1B2226; stroke: #E10600; stroke-width: 2; }
      .node.pulse { animation: pulse 2s ease-in-out infinite; }
      .line { fill: none; stroke: #333; stroke-width: 2; }
      .line.draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawLine 1s ease-out forwards; }
      .text { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; fill: #F2F4F5; }
      .text-muted { fill: #8A9499; font-size: 11px; }
      @keyframes pulse {
        0%, 100% { r: 6; opacity: 1; }
        50% { r: 9; opacity: 0.6; }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .node.pulse { animation: none; r: 6; opacity: 1; }
        .line.draw { stroke-dashoffset: 0; animation: none; }
      }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="800" height="500" rx="16" fill="#101517" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Left: chat input bubble -->
  <rect x="60" y="200" width="200" height="60" rx="10" fill="#161C1F" stroke="#222" stroke-width="1"/>
  <text x="90" y="235" class="text">Book a meeting tomorrow</text>
  <text x="90" y="250" class="text-muted">at 3 PM</text>
  <circle cx="240" cy="230" r="6" fill="#E10600"/>

  <!-- Connector: chat -> webhook -->
  <line class="line draw" x1="240" y1="230" x2="320" y2="230"/>

  <!-- Node: Webhook -->
  <circle cx="340" cy="230" r="8" class="node pulse"/>
  <text x="356" y="235" class="text-muted">Webhook</text>

  <!-- Connector: webhook -> openai -->
  <line class="line draw" x1="348" y1="230" x2="412" y2="230"/>

  <!-- Node: OpenAI -->
  <circle cx="420" cy="230" r="8" class="node pulse"/>
  <text x="436" y="235" class="text-muted">OpenAI</text>

  <!-- Connector: openai -> validate -->
  <line class="line draw" x1="428" y1="230" x2="492" y2="230"/>

  <!-- Node: Validate -->
  <circle cx="500" cy="230" r="8" class="node pulse"/>
  <text x="516" y="235" class="text-muted">Validate</text>

  <!-- Connector: validate -> calendar -->
  <line class="line draw" x1="508" y1="230" x2="572" y2="230"/>

  <!-- Right: calendar card -->
  <rect x="580" y="120" width="200" height="220" rx="12" fill="#161C1F" stroke="#222" stroke-width="1"/>
  <rect x="590" y="130" width="180" height="30" rx="6" fill="#222"/>
  <text x="600" y="148" class="text">Calendar</text>
  <rect x="590" y="170" width="180" height="120" fill="#101517"/>
  <!-- highlighted event block -->
  <rect x="600" y="200" width="160" height="30" rx="6" fill="#E10600" opacity="0.15" stroke="#E10600" stroke-width="1"/>
  <text x="610" y="218" class="text" style="fill:#E10600;">Team sync</text>
  <text x="600" y="300" class="text-muted">Event confirmed</text>

  <!-- Confirmation toast -->
  <rect x="580" y="360" width="200" height="50" rx="8" fill="#222" stroke="#222" stroke-width="1"/>
  <text x="595" y="380" class="text">Confirmation sent</text>
  <text x="595" y="395" class="text-muted">Event added to calendar</text>
</svg>
