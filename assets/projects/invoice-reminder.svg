<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Invoice reminder concept demo illustration">
  <defs>
    <style>
      .node { fill: #1B2226; stroke: #E10600; stroke-width: 2; }
      .node.pulse { animation: pulse 2s ease-in-out infinite; }
      .line { fill: none; stroke: #333; stroke-width: 2; }
      .line.draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawLine 1s ease-out forwards; }
      .text { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; fill: #F2F4F5; }
      .text-muted { fill: #8A9499; font-size: 11px; }
      .badge { fill: #E10600; color: #0A0A0A; font-size: 10px; font-weight: 700; }
      .row { fill: none; stroke: #222; stroke-width: 1; }
      @keyframes pulse {
        0%, 100% { r: 6; opacity: 1; }
        50% { r: 9; opacity: 0.6; }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .node.pulse { animation: none; r: 6; opacity: 1; }
        .line.draw { stroke-dashoffset: 0; animation: none; }
      }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="800" height="500" rx="16" fill="#101517" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="30" y="20" width="120" height="26" rx="6" fill="#E10600" opacity="0.1" stroke="#E10600" stroke-width="1"/>
  <text x="50" y="39" class="text" style="fill:#E10600; font-size:10px; font-weight:700; letter-spacing:0.1em;">Concept</text>

  <!-- Left: invoice table -->
  <rect x="50" y="120" width="320" height="300" rx="12" fill="#161C1F" stroke="#222" stroke-width="1"/>
  <text x="70" y="145" class="text" style="font-weight:700;">Invoice log</text>
  <!-- header row -->
  <rect x="70" y="160" width="260" height="30" fill="#101517"/>
  <text x="80" y="178" class="text-muted" style="font-size:10px;">Invoice #</text>
  <text x="220" y="178" class="text-muted" style="font-size:10px;">Status</text>
  <!-- row 1 -->
  <rect x="70" y="200" width="260" height="30" fill="#101517" opacity="0.5"/>
  <text x="80" y="218" class="text">INV-001</text>
  <text x="220" y="218" class="text-muted">Paid</text>
  <!-- row 2 -->
  <rect x="70" y="240" width="260" height="30" fill="#101517"/>
  <text x="80" y="258" class="text">INV-002</text>
  <rect x="210" y="248" width="50" height="20" rx="4" fill="#E10600"/>
  <text x="222" y="261" class="badge">Due</text>
  <!-- row 3 -->
  <rect x="70" y="280" width="260" height="30" fill="#101517" opacity="0.5"/>
  <text x="80" y="298" class="text">INV-003</text>
  <text x="220" y="298" class="text-muted">Paid</text>

  <!-- Connector: table -> n8n -->
  <line class="line draw" x1="390" y1="270" x2="440" y2="270"/>

  <!-- Node: n8n -->
  <circle cx="450" cy="270" r="8" class="node pulse"/>
  <text x="466" y="275" class="text-muted">n8n</text>

  <!-- Connector: n8n -> sheets -->
  <line class="line draw" x1="458" y1="270" x2="520" y2="270"/>

  <!-- Node: Google Sheets -->
  <circle cx="530" cy="270" r="8" class="node pulse"/>
  <text x="546" y="275" class="text-muted">Sheets</text>

  <!-- Connector: sheets -> email -->
  <line class="line draw" x1="538" y1="270" x2="600" y2="270"/>

  <!-- Node: Email -->
  <circle cx="610" cy="270" r="8" class="node pulse"/>
  <text x="626" y="275" class="text-muted">Email</text>

  <!-- Right: reminder preview -->
  <rect x="620" y="120" width="150" height="120" rx="12" fill="#161C1F" stroke="#222" stroke-width="1"/>
  <text x="640" y="150" class="text" style="font-weight:700;">Reminder sent</text>
  <text x="640" y="175" class="text-muted">INV-002 is overdue</text>
  <rect x="640" y="195" width="110" height="30" rx="6" fill="#101517"/>
  <text x="650" y="213" class="text-muted">Please settle balance</text>
</svg>
