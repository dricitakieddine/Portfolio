<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Invoice Reminder Automation concept demo illustration">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A1D0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#101517;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B221A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E141A;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feOffset dx="0" dy="4" in="blur" result="offsetBlur" />
      <feComponentTransfer in="offsetBlur"><feFuncA type="linear" slope="0.3" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="offsetBlur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <circle cx="660" cy="90" r="110" fill="#F5B83D" opacity="0.12" filter="blur(40px)" />
  <circle cx="140" cy="390" r="100" fill="#D97706" opacity="0.08" filter="blur(40px)" />

  <!-- Left: Invoice table -->
  <rect x="50" y="120" width="320" height="340" rx="12" fill="#161C1F" stroke="#222" stroke-width="2" />
  <text x="70" y="150" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F2F4F5">Invoice Log</text>
  
  <!-- Table header -->
  <rect x="70" y="170" width="280" height="34" rx="4" fill="#101517" />
  <text x="85" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#8A9499">Invoice #</text>
  <text x="220" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#8A9499">Status</text>
  
  <!-- Row 1 -->
  <rect x="70" y="210" width="280" height="34" rx="4" fill="#101517" />
  <text x="85" y="228" font-family="system-ui, sans-serif" font-size="13" fill="#F2F4F5">INV-001</text>
  <text x="220" y="228" font-family="system-ui, sans-serif" font-size="13" fill="#25D366" font-weight="700">Paid</text>
  
  <!-- Row 2 -->
  <rect x="70" y="250" width="280" height="34" rx="4" fill="#101517" />
  <text x="85" y="268" font-family="system-ui, sans-serif" font-size="13" fill="#F2F4F5">INV-002</text>
  <rect x="200" y="258" width="50" height="22" rx="6" fill="#E10600" opacity="0.15" stroke="#E10600" stroke-width="1" />
  <text x="222" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#E10600" font-weight="700">Due</text>
  
  <!-- Row 3 -->
  <rect x="70" y="290" width="280" height="34" rx="4" fill="#101517" />
  <text x="85" y="308" font-family="system-ui, sans-serif" font-size="13" fill="#F2F4F5">INV-003</text>
  <text x="220" y="308" font-family="system-ui, sans-serif" font-size="13" fill="#25D366" font-weight="700">Paid</text>

  <!-- Connector -->
  <line x1="390" y="270" x2="460" y="270" stroke="#333" stroke-width="2" />
  <circle cx="400" cy="270" r="4" fill="#F5B83D" />

  <!-- Right: Reminder preview -->
  <rect x="420" y="120" width="280" height="260" rx="12" fill="#161C1F" stroke="#222" stroke-width="2" />
  <text x="440" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F2F4F5">Reminder Sent</text>
  
  <rect x="440" y="180" width="240" height="70" rx="8" fill="#101517" />
  <text x="455" y="168" font-family="system-ui, sans-serif" font-size="12" fill="#F2F4F5">Subject: Invoice</text>
  <text x="455" y="182" font-family="system-ui, sans-serif" font-size="11" fill="#9A9499">INV-002 is now overdue.</text>
  <text x="455" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#F2F4F5">Please settle your balance by Friday.</text>
  
  <rect x="455" y="206" width="110" height="34" rx="6" fill="#0A0A0A" />
  <text x="460" y="223" font-family="system-ui, sans-serif" font-size="10" fill="#F2F4F5">Pay Now</text>

  <!-- Connector line -->
  <line x1="420" y="190" x2="560" y="190" stroke="#333" stroke-width="2" />
  <circle cx="410" cy="190" r="4" fill="#F5B83D" />
</svg>