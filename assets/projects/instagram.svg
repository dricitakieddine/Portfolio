<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Instagram Content & Growth System workflow illustration">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0F1F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#101517;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#161525;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E121F;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feOffset dx="0" dy="4" in="blur" result="offsetBlur" />
      <feComponentTransfer in="offsetBlur"><feFuncA type="linear" slope="0.3" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="offsetBlur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <circle cx="660" cy="90" r="110" fill="#DD2A7B" opacity="0.12" filter="blur(40px)" />
  <circle cx="140" cy="390" r="110" fill="#F58529" opacity="0.1" filter="blur(40px)" />
  <circle cx="720" cy="380" r="90" fill="#8134AF" opacity="0.08" filter="blur(40px)" />

  <!-- Calendar strip (left) -->
  <rect x="50" y="130" width="260" height="300" rx="12" fill="#161C1F" stroke="#222" stroke-width="1" />
  <text x="70" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F2F4F5">October</text>
  <text x="70" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#8A9499">October 2026</text>
  
  <!-- Day dots grid -->
  <g transform="translate(70, 190)">
    <circle cx="15" cy="25" r="4" fill="#F58529" />
    <circle cx="55" cy="25" r="4" fill="#8134AF" />
    <circle cx="95" cy="25" r="4" fill="#DD2A7B" />
    <circle cx="135" cy="25" r="4" fill="#F58529" />
    <circle cx="15" cy="50" r="4" fill="#8134AF" />
    <circle cx="55" cy="50" r="4" fill="#DD2A7B" />
    <circle cx="95" cy="50" r="4" fill="#F58529" />
    <circle cx="135" cy="50" r="4" fill="#8134AF" />
    <circle cx="15" cy="75" r="4" fill="#DD2A7B" />
    <circle cx="55" cy="75" r="4" fill="#F58529" />
    <circle cx="95" cy="75" r="4" fill="#8134AF" />
    <circle cx="135" cy="75" r="4" fill="#F58529" />
    <text x="15" cy="105" font-family="system-ui, sans-serif" font-size="10" fill="#8A9499">Oct 1-7</text>
    <text x="55" cy="105" font-family="system-ui, sans-serif" font-size="10" fill="#8A9499">Oct 8-14</text>
    <text x="95" cy="105" font-family="system-ui, sans-serif" font-size="10" fill="#8A9499">Oct 15-21</text>
    <text x="135" cy="105" font-family="system-ui, sans-serif" font-size="10" fill="#8A9499">Oct 22-31</text>
  </g>

  <!-- Content grid (center) -->
  <g transform="translate(330, 140)">
    <text x="0" y="-10" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F2F4F5">Content Grid</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="80" height="80" rx="6" fill="#161C1F" stroke="#222" stroke-width="1" />
      <circle cx="40" cy="40" r="20" fill="#E10600" opacity="0.3" />
      <text x="40" cy="40" font-family="system-ui, sans-serif" font-size="14" fill="#E10600" font-weight="700" text-anchor="middle">1</text>
      <rect x="90" y="0" width="80" height="80" rx="6" fill="#161C1F" stroke="#222" stroke-width="1" />
      <circle cx="130" cy="40" r="20" fill="#F58529" opacity="0.3" />
      <text x="130" cy="40" font-family="system-ui, sans-serif" font-size="14" fill="#F58529" font-weight="700" text-anchor="middle">2</text>
      <rect x="180" y="0" width="80" height="80" rx="6" fill="#161C1F" stroke="#222" stroke-width="1" />
      <circle cx="180" cy="40" r="20" fill="#DD2A7B" opacity="0.3" />
      <text x="180" cy="40" font-family="system-ui, sans-serif" font-size="14" fill="#DD2A7B" font-weight="700" text-anchor="middle">3</text>
      
      <rect x="0" y="90" width="80" height="80" rx="6" fill="#161C1F" stroke="#222" stroke-width="1" />
      <circle cx="40" cy="40" r="20" fill="#DD2A7B" opacity="0.3" />
      <text x="40" cy="40" font-family="system-ui, sans-serif" font-size="14" fill="#DD2A7B" font-weight="700" text-anchor="middle">4</text>
      <rect x="90" y="90" width="80" height="80" rx="6" fill="#161C1F" stroke="#222" stroke-width="1" />
      <circle cx="130" cy="40" r="20" fill="#8134AF" opacity="0.3" />
      <text x="130" cy="40" font-family="system-ui, sans-serif" font-size="14" fill="#8134AF" font-weight="700" text-anchor="middle">5</text>
      <rect x="180" y="90" width="80" height="80" rx="6" fill="#161C1F" stroke="#222" stroke-width="1" />
      <circle cx="180" cy="40" r="20" fill="#2AABEE" opacity="0.3" />
      <text x="180" cy="40" font-family="system-ui, sans-serif" font-size="14" fill="#2AABEE" font-weight="700" text-anchor="middle">6</text>
      
      <rect x="0" y="180" width="80" height="80" rx="6" fill="#161C1F" stroke="#222" stroke-width="1" />
      <circle cx="40" cy="40" r="20" fill="#8134AF" opacity="0.3" />
      <text x="40" cy="40" font-family="system-ui, sans-serif" font-size="14" fill="#8134AF" font-weight="700" text-anchor="middle">7</text>
      <rect x="90" y="180" width="80" height="80" rx="6" fill="#161C1F" stroke="#222" stroke-width="1" />
      <circle cx="130" cy="40" r="20" fill="#F58529" opacity="0.3" />
      <text x="130" cy="40" font-family="system-ui, sans-serif" font-size="14" fill="#F58529" font-weight="700" text-anchor="middle">8</text>
      <rect x="180" y="180" width="80" height="80" rx="6" fill="#161C1F" stroke="#222" stroke-width="1" />
      <circle cx="180" cy="40" r="20" fill="#DD2A7B" opacity="0.3" />
      <text x="180" cy="40" font-family="system-ui, sans-serif" font-size="14" fill="#DD2A7B" font-weight="700" text-anchor="middle">9</text>
    </g>
  </g>

  <!-- Storyboard (right) -->
  <g transform="translate(570, 160)">
    <text x="0" y="-10" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F2F4F5">Storyboard</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="150" height="120" rx="10" fill="#161C1F" stroke="#222" stroke-width="1" />
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#E10600" font-weight="700">1</text>
      <text x="30" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#F2F4F5">Hook</text>
      <rect x="160" y="0" width="150" height="120" rx="8" fill="#161C1F" stroke="#222" stroke-width="1" />
      <text x="180" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#E10600">2</text>
      <text x="195" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#F2F4F5">Body</text>
      <rect x="320" y="0" width="150" height="120" rx="8" fill="#161C1F" stroke="#222" stroke-width="1" />
      <text x="340" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#E10600">3</text>
      <text x="355" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#F2F4F5">CTA</text>
    </g>
  </g>
  
  <!-- Arrow between content grid and storyboard -->
  <line x1="430" y="310" x2="570" y="310" stroke="#333" stroke-width="2" />
  <circle cx="430" cy="310" r="4" fill="#E10600" />
</svg>