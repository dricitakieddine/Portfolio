<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Instagram content workflow illustration">
  <defs>
    <style>
      .tile { fill: #101517; stroke: #222; stroke-width: 1; }
      .tile.red { fill: #E10600; }
      .text { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; fill: #F2F4F5; }
      .text-muted { fill: #8A9499; font-size: 11px; }
      .day { fill: none; stroke: #222; stroke-width: 1; }
      .day.hl { stroke: #E10600; }
      .dot { fill: #E10600; }
      .frame { fill: #161C1F; stroke: #222; stroke-width: 1; }
      .label { fill: #E10600; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; }
      @media (prefers-reduced-motion: reduce) {
        .dot { animation: none; opacity: 1; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="800" height="500" rx="16" fill="#101517" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Left: 30-day calendar strip -->
  <text x="50" y="60" class="text" style="font-weight:700;">30-day calendar</text>
  <g transform="translate(50, 90)">
    <!-- header row -->
    <text x="0" y="0" class="text-muted" style="font-size:10px;">M</text>
    <text x="40" y="0" class="text-muted" style="font-size:10px;">T</text>
    <text x="80" y="0" class="text-muted" style="font-size:10px;">W</text>
    <text x="120" y="0" class="text-muted" style="font-size:10px;">T</text>
    <text x="160" y="0" class="text-muted" style="font-size:10px;">F</text>
    <text x="200" y="0" class="text-muted" style="font-size:10px;">S</text>
    <text x="240" y="0" class="text-muted" style="font-size:10px;">S</text>
    <!-- days -->
    <rect x="0" y="15" width="30" height="30" rx="4" class="day hl"/>
    <rect x="40" y="15" width="30" height="30" rx="4" class="day"/>
    <rect x="80" y="15" width="30" height="30" rx="4" class="day hl"/>
    <rect x="120" y="15" width="30" height="30" rx="4" class="day"/>
    <rect x="160" y="15" width="30" height="30" rx="4" class="day hl"/>
    <rect x="200" y="15" width="30" height="30" rx="4" class="day"/>
    <rect x="240" y="15" width="30" height="30" rx="4" class="day hl"/>
    <rect x="0" y="55" width="30" height="30" rx="4" class="day"/>
    <rect x="40" y="55" width="30" height="30" rx="4" class="day hl"/>
    <rect x="80" y="55" width="30" height="30" rx="4" class="day"/>
    <rect x="120" y="55" width="30" height="30" rx="4" class="day hl"/>
    <rect x="160" y="55" width="30" height="30" rx="4" class="day"/>
    <rect x="200" y="55" width="30" height="30" rx="4" class="day hl"/>
    <rect x="240" y="55" width="30" height="30" rx="4" class="day"/>
  </g>
  <text x="50" y="360" class="text-muted">Consistent posting cadence</text>

  <!-- Center: 3x3 post grid -->
  <text x="330" y="60" class="text" style="font-weight:700;">Content grid</text>
  <g transform="translate(300, 90)">
    <rect x="0" y="0" width="90" height="90" rx="4" class="tile"/>
    <rect x="100" y="0" width="90" height="90" rx="4" class="tile red"/>
    <rect x="200" y="0" width="90" height="90" rx="4" class="tile"/>
    <rect x="0" y="100" width="90" height="90" rx="4" class="tile red"/>
    <rect x="100" y="100" width="90" height="90" rx="4" class="tile"/>
    <rect x="200" y="100" width="90" height="90" rx="4" class="tile red"/>
    <rect x="0" y="200" width="90" height="90" rx="4" class="tile"/>
    <rect x="100" y="200" width="90" height="90" rx="4" class="tile red"/>
    <rect x="200" y="200" width="90" height="90" rx="4" class="tile"/>
  </g>
  <text x="330" y="360" class="text-muted">Faceless posts, no logos</text>

  <!-- Right: storyboard -->
  <text x="610" y="60" class="text" style="font-weight:700;">Short-video storyboard</text>
  <g transform="translate(580, 90)">
    <!-- frame 1 -->
    <rect x="0" y="0" width="80" height="60" rx="6" class="frame"/>
    <text x="10" y="30" class="text-muted">Hook</text>
    <text x="10" y="75" class="label">Hook</text>
    <!-- frame 2 -->
    <rect x="95" y="0" width="80" height="60" rx="6" class="frame"/>
    <text x="105" y="30" class="text-muted">Body</text>
    <text x="105" y="75" class="label">Body</text>
    <!-- frame 3 -->
    <rect x="190" y="0" width="80" height="60" rx="6" class="frame"/>
    <text x="200" y="30" class="text-muted">CTA</text>
    <text x="200" y="75" class="label">CTA</text>
  </g>
  <text x="580" y="360" class="text-muted">Hook → Body → CTA</text>
</svg>
