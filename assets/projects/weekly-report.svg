<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Weekly content report concept demo illustration">
  <defs>
    <style>
      .node { fill: #1B2226; stroke: #E10600; stroke-width: 2; }
      .node.pulse { animation: pulse 2s ease-in-out infinite; }
      .line { fill: none; stroke: #333; stroke-width: 2; }
      .line.draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawLine 1s ease-out forwards; }
      .text { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; fill: #F2F4F5; }
      .text-muted { fill: #8A9499; font-size: 11px; }
      .badge { fill: #E10600; }
      .bar { fill: #161C1F; stroke: #222; stroke-width: 1; }
      .bar.red { fill: #E10600; }
      @keyframes pulse {
        0%, 100% { r: 6; opacity: 1; }
        50% { r: 9; opacity: 0.6; }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .node.pulse { animation: none; r: 6; opacity: 1; }
        .line.draw { stroke-dashoffset: 0; animation: none; }
      }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="800" height="500" rx="16" fill="#101517" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="30" y="20" width="120" height="26" rx="6" fill="#E10600" opacity="0.1" stroke="#E10600" stroke-width="1"/>
  <text x="50" y="39" class="text" style="fill:#E10600; font-size:10px; font-weight:700; letter-spacing:0.1em;">Concept</text>

  <!-- Left: bar chart -->
  <rect x="50" y="120" width="320" height="300" rx="12" fill="#161C1F" stroke="#222" stroke-width="1"/>
  <text x="70" y="145" class="text" style="font-weight:700;">Weekly report</text>
  <!-- bars -->
  <rect x="90" y="300" width="30" height="60" rx="4" class="bar"/>
  <rect x="130" y="260" width="30" height="100" rx="4" class="bar"/>
  <rect x="170" y="320" width="30" height="40" rx="4" class="bar"/>
  <rect x="210" y="220" width="30" height="140" rx="4" class="bar red"/>
  <rect x="250" y="280" width="30" height="80" rx="4" class="bar"/>
  <rect x="290" y="240" width="30" height="120" rx="4" class="bar"/>
  <text x="90" y="370" class="text-muted" style="font-size:9px;">Mon</text>
  <text x="130" y="370" class="text-muted" style="font-size:9px;">Tue</text>
  <text x="170" y="370" class="text-muted" style="font-size:9px;">Wed</text>
  <text x="210" y="370" class="text-muted" style="font-size:9px;">Thu</text>
  <text x="250" y="370" class="text-muted" style="font-size:9px;">Fri</text>
  <text x="290" y="370" class="text-muted" style="font-size:9px;">Sat</text>

  <!-- Connector: chart -> python -->
  <line class="line draw" x1="390" y1="270" x2="440" y2="270"/>

  <!-- Node: Python -->
  <circle cx="450" cy="270" r="8" class="node pulse"/>
  <text x="466" y="275" class="text-muted">Python</text>

  <!-- Connector: python -> sheets -->
  <line class="line draw" x1="458" y1="270" x2="520" y2="270"/>

  <!-- Node: Google Sheets -->
  <circle cx="530" cy="270" r="8" class="node pulse"/>
  <text x="546" y="275" class="text-muted">Sheets</text>

  <!-- Right: sheet preview -->
  <rect x="620" y="120" width="150" height="220" rx="12" fill="#161C1F" stroke="#222" stroke-width="1"/>
  <text x="640" y="150" class="text" style="font-weight:700;">Weekly summary</text>
  <!-- sheet header -->
  <rect x="640" y="170" width="110" height="25" rx="6" fill="#101517"/>
  <text x="650" y="188" class="text-muted" style="font-size:10px;">Metric | Value</text>
  <!-- rows -->
  <rect x="640" y="205" width="110" height="25" fill="#101517" opacity="0.5"/>
  <text x="650" y="223" class="text-muted" style="font-size:10px;">Posts | —</text>
  <rect x="640" y="240" width="110" height="25" fill="#101517"/>
  <text x="650" y="258" class="text-muted" style="font-size:10px;">Reach | —</text>
  <rect x="640" y="275" width="110" height="25" fill="#101517"/>
  <text x="650" y="293" class="text-muted" style="font-size:10px;">Engage | —</text>
  <rect x="640" y="310" width="110" height="25" fill="#101517"/>
  <text x="650" y="328" class="text-muted" style="font-size:10px;">Best time | —</text>
</svg>
