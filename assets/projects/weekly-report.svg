<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Weekly Content Report Generator concept demo illustration">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0F1F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#101517;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#161C1F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E141E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feOffset dx="0" dy="4" in="blur" result="offsetBlur" />
      <feComponentTransfer in="offsetBlur"><feFuncA type="linear" slope="0.3" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="offsetBlur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <circle cx="660" cy="90" r="110" fill="#2DD4BF" opacity="0.12" filter="blur(40px)" />
  <circle cx="140" cy="390" r="100" fill="#8B5CF6" opacity="0.08" filter="blur(40px)" />

  <!-- Left: Bar chart -->
  <rect x="50" y="130" width="260" height="300" rx="12" fill="#161C1F" stroke="#222" stroke-width="2" />
  <text x="70" y="150" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F2F4F5">Weekly Report</text>
  
  <!-- Bar chart bars -->
  <rect x="70" y="350" width="30" height="40" rx="4" fill="#161C1F" stroke="#222" stroke-width="1" />
  <rect x="100" y="300" width="30" height="80" rx="4" fill="#161C1F" stroke="#222" stroke-width="1" />
  <rect x="130" y="280" width="30" height="100" rx="4" fill="#161C1F" stroke="#222" stroke-width="1" />
  <rect x="160" y="240" width="30" height="140" rx="4" fill="#E10600" />
  <rect x="190" y="320" width="30" height="60" rx="4" fill="#161C1F" stroke="#222" stroke-width="1" />
  <rect x="220" y="260" width="30" height="120" rx="4" fill="#161C1F" stroke="#222" stroke-width="1" />
  <rect x="250" y="340" width="30" height="40" rx="4" fill="#161C1F" stroke="#222" stroke-width="1" />
  
  <!-- Day labels -->
  <text x="70" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#8A9499">Mon</text>
  <text x="100" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#8A9499">Tue</text>
  <text x="130" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#8A9499">Wed</text>
  <text x="160" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#8A9499">Thu</text>
  <text x="190" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#8A9499">Fri</text>
  <text x="220" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#8A9499">Sat</text>
  <text x="250" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#8A9499">Sun</text>

  <!-- Connector -->
  <line x1="330" y="250" x2="420" y="250" stroke="#333" stroke-width="2" />
  <circle cx="400" cy="250" r="4" fill="#2DD4BF" />

  <!-- Right: Sheet preview -->
  <rect x="420" y="130" width="280" height="280" rx="12" fill="#161C1F" stroke="#222" stroke-width="2" />
  <text x="440" y="150" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F2F4F5">Weekly Summary</text>
  
  <!-- Sheet header -->
  <rect x="440" y="170" width="240" height="28" rx="6" fill="#101517" />
  <text x="455" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#9A9499">Metric</text>
  <text x="530" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#9A9499">Value</text>
  
  <!-- Sheet rows -->
  <rect x="440" y="190" width="240" height="30" fill="#101517" />
  <text x="455" y="208" font-family="system-ui, sans-serif" font-size="12" fill="#9A9499">Posts</text>
  <text x="455" y="224" font-family="system-ui, sans-serif" font-size="12" fill="#9A9499">Reach</text>
  <rect x="440" y="220" width="240" height="30" fill="#101517" />
  <text x="455" y="238" font-family="system-ui, sans-serif" font-size="12" fill="#9A9499">Engagement</text>
  <rect x="440" y="250" width="240" height="30" fill="#101517" />
  <text x="455" y="268" font-family="system-ui, sans-serif" font-size="12" fill="#9A9499">Best Time</text>
  
  <!-- Connector line -->
  <line x1="560" y="270" x2="560" y="290" stroke="#333" stroke-width="2" />
  <circle cx="560" cy="270" r="4" fill="#2DD4BF" />
  
  <!-- Right side: Right side detail box -->
  <rect x="580" y="130" width="210" height="280" rx="12" fill="#161C1F" stroke="#222" stroke-width="2" />
  <text x="600" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F2F4F5">Weekly Summary</text>
  <text x="600" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#9A9499">Total posts: 42</text>
  <text x="600" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#9A9499">Total reach: 12.4K</text>
  <text x="600" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#9A9499">Total engagement: 1.2K</text>
  <text x="600" y="233" font-family="system-ui, sans-serif" font-size="11" fill="#9A9499">Best posting time: Thu 4PM</text>
  
  <!-- Result badge -->
  <rect x="440" y="360" width="160" height="50" rx="8" fill="#101517" stroke="#2DD4BF" stroke-width="1" />
  <text x="455" y="382" font-family="system-ui, sans-serif" font-size="12" fill="#2DD4BF" font-weight="700">Weekly report generated</text>
  
  <!-- Concept badge -->
  <rect x="30" y="360" width="130" height="34" rx="8" fill="#161C1F" stroke="#2DD4BF" stroke-width="1" />
  <text x="60" y="380" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF" letter-spacing="0.1em" text-transform="uppercase">Concept</text>
</svg>