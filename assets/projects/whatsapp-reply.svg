<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="WhatsApp auto-reply concept demo illustration">
  <defs>
    <style>
      .node { fill: #1B2226; stroke: #E10600; stroke-width: 2; }
      .node.pulse { animation: pulse 2s ease-in-out infinite; }
      .line { fill: none; stroke: #333; stroke-width: 2; }
      .line.draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawLine 1s ease-out forwards; }
      .text { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; fill: #F2F4F5; }
      .text-muted { fill: #8A9499; font-size: 11px; }
      .bubble-in { fill: #25D366; }
      .bubble-out { fill: #161C1F; stroke: #222; stroke-width: 1; }
      .badge { fill: #E10600; }
      @keyframes pulse {
        0%, 100% { r: 6; opacity: 1; }
        50% { r: 9; opacity: 0.6; }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .node.pulse { animation: none; r: 6; opacity: 1; }
        .line.draw { stroke-dashoffset: 0; animation: none; }
      }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="800" height="500" rx="16" fill="#101517" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="30" y="20" width="120" height="26" rx="6" fill="#E10600" opacity="0.1" stroke="#E10600" stroke-width="1"/>
  <text x="50" y="39" class="text" style="fill:#E10600; font-size:10px; font-weight:700; letter-spacing:0.1em;">Concept</text>

  <!-- Left: chat -->
  <rect x="50" y="100" width="300" height="340" rx="16" fill="#0A0A0A"/>
  <rect x="60" y="120" width="280" height="40" fill="#161C1F"/>
  <text x="80" y="140" class="text">Inbound lead</text>

  <!-- incoming bubble -->
  <rect x="80" y="190" width="120" height="44" rx="10" class="bubble-out"/>
  <text x="100" y="210" class="text-muted">Interested in your service</text>
  <text x="100" y="224" class="text-muted">— can you help?</text>

  <!-- auto-reply bubble -->
  <rect x="80" y="260" width="140" height="44" rx="10" class="bubble-in"/>
  <text x="100" y="280" class="text">Thanks! Here's how it works…</text>

  <!-- Connector: chat -> n8n -->
  <line class="line draw" x1="370" y1="270" x2="440" y2="270"/>

  <!-- Node: n8n -->
  <circle cx="450" cy="270" r="8" class="node pulse"/>
  <text x="466" y="275" class="text-muted">n8n</text>

  <!-- Connector: n8n -> WhatsApp -->
  <line class="line draw" x1="458" y1="270" x2="540" y2="270"/>

  <!-- Node: WhatsApp -->
  <circle cx="550" cy="270" r="8" class="node pulse"/>
  <text x="566" y="275" class="text-muted">WhatsApp</text>

  <!-- Right: note -->
  <rect x="620" y="220" width="150" height="120" rx="12" fill="#161C1F" stroke="#222" stroke-width="1"/>
  <text x="640" y="250" class="text-muted">Auto-reply sent instantly</text>
  <text x="640" y="270" class="text">Lead engaged</text>
  <rect x="640" y="290" width="110" height="10" rx="4" fill="#222"/>
</svg>
