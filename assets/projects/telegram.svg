<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Personal AI Telegram Assistant workflow illustration">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1D2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#101517;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#161C25;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E141E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feOffset dx="0" dy="4" in="blur" result="offsetBlur" />
      <feComponentTransfer in="offsetBlur"><feFuncA type="linear" slope="0.3" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="offsetBlur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <path d="M0 50 L800 50 M0 100 L800 100 M0 150 L800 150 M0 200 L800 200 M0 250 L800 250 M0 300 L800 300 M0 350 L800 350 M0 400 L800 400 M0 450 L800 450 M50 0 L50 500 M150 0 L150 500 M250 0 L250 500 M350 0 L350 500 M450 0 L450 500 M550 0 L550 500 M650 0 L650 500 M750 0 L750 500" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <circle cx="680" cy="90" r="100" fill="#2AABEE" opacity="0.12" filter="blur(40px)" />
  <circle cx="140" cy="390" r="100" fill="#229ED9" opacity="0.08" filter="blur(40px)" />

  <!-- Phone frame -->
  <rect x="50" y="120" width="320" height="340" rx="24" fill="#0A0A0A" stroke="#222" stroke-width="2" />
  <rect x="60" y="130" width="300" height="40" rx="8" fill="#161C1F" />
  <text x="75" y="150" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F2F4F5">Chat</text>
  <text x="280" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#8A9499">•••</text>

  <!-- Voice bubble -->
  <rect x="70" y="220" width="160" height="60" rx="16" fill="#25D366" />
  <text x="85" y="242" font-family="system-ui, sans-serif" font-size="13" fill="#0A0A0A">🎙️ Voice message</text>
  <circle cx="150" y="250" r="8" fill="#F2F4F4" />
  <circle cx="160" y="250" r="4" fill="#0A0A0A" />
  <circle cx="158" y="246" r="2" fill="#0A0A0A" />

  <!-- Text bubble -->
  <rect x="70" y="290" width="140" height="44" rx="10" fill="#161C1F" stroke="#222" stroke-width="1" />
  <text x="85" y="312" font-family="system-ui, sans-serif" font-size="13" fill="#9A9499">Can you reschedule?</text>

  <!-- Bot bubble -->
  <rect x="200" y="340" width="140" height="52" rx="10" fill="#161C1F" stroke="#222" stroke-width="1" />
  <text x="215" y="360" font-family="system-ui, sans-serif" font-size="13" fill="#F2F4F5">Rescheduled for Friday</text>
  <circle x="200" y="365" r="6" fill="#2AABEE" />
  <text x="195" y="369" font-family="system-ui, sans-serif" font-size="10" fill="#0B1D2E" font-weight="700" text-anchor="middle">T</text>

  <!-- Connector -->
  <line x1="330" y="270" x2="420" y="270" stroke="#333" stroke-width="2" />
  <circle cx="330" cy="270" r="4" fill="#2AABEE" />

  <!-- Node flow -->
  <g transform="translate(430, 240)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#161C1F" stroke="#333" stroke-width="1" />
    <text x="50" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F2F4F5">Telegram</text>
    <text x="50" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9A9499">Trigger</text>
    <line x1="100" y="25" x2="120" y="25" stroke="#333" stroke-width="2" />
    <circle cx="128" cy="25" r="4" fill="#2AABEE" />
    
    <rect x="130" y="0" width="100" height="50" rx="8" fill="#161C1F" stroke="#333" stroke-width="1" />
    <text x="180" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F2F4F5">Speech to text</text>
    <line x1="230" y="25" x2="250" y="25" stroke="#333" stroke-width="2" />
    <circle cx="258" cy="25" r="4" fill="#2AABEE" />
    
    <rect x="260" y="0" width="100" height="50" rx="8" fill="#161C1F" stroke="#333" stroke-width="1" />
    <text x="310" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F2F4F5">OpenAI</text>
    <line x1="360" y="25" x2="420" y="25" stroke="#333" stroke-width="2" />
    <circle cx="428" cy="25" r="4" fill="#2AABEE" />
    
    <rect x="430" y="0" width="100" height="50" rx="8" fill="#161C1F" stroke="#333" stroke-width="1" />
    <text x="480" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F2F4F5">Rules</text>
    <line x1="530" y="25" x2="550" y="25" stroke="#333" stroke-width="2" />
    <circle cx="558" cy="25" r="4" fill="#2AABEE" />
    
    <rect x="560" y="0" width="100" height="50" rx="8" fill="#161C1F" stroke="#333" stroke-width="1" />
    <text x="610" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F2F4F5">Reply</text>
  </g>
  
  <!-- Toast -->
  <rect x="420" y="340" width="140" height="60" rx="8" fill="#101517" stroke="#2AABEE" stroke-width="1" filter="url(#glow)" />
  <text x="440" y="360" font-family="system-ui, sans-serif" font-size="12" fill="#2AABEE" font-weight="700">✓ Reply sent</text>
  <text x="440" y="376" font-family="system-ui, sans-serif" font-size="11" fill="#9A9499">Bot responded</text>
</svg>